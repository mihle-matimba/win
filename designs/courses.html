<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIN · Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
/* ── Courses page styles ── */

.c-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  margin-bottom:8px;
}
.c-header h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.c-header .sub{font-size:14px;color:var(--muted);margin-top:4px}
.c-stats{display:flex;gap:20px}
.c-stat{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 20px;text-align:center;min-width:90px;
}
.c-stat .num{font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff}
.c-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}

/* course grid */
.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}

/* course card */
.c-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.c-card:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 48px -16px rgba(0,0,0,.5);
  border-color:rgba(255,255,255,.12);
}
.c-banner{
  height:160px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.c-banner .grad{position:absolute;inset:0}
.c-banner .icon{position:relative;font-size:42px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4))}
.c-badge{
  position:absolute;top:12px;left:12px;
  font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.4px;
}
.c-badge.beginner{background:rgba(53,215,155,.14);color:var(--green-val);border:1px solid rgba(53,215,155,.3)}
.c-badge.intermediate{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(91,116,255,.3)}
.c-badge.advanced{background:var(--purple-soft);color:var(--purple-val);border:1px solid rgba(168,130,255,.3)}
.c-count{
  position:absolute;top:12px;right:12px;
  font-size:11px;font-weight:600;padding:5px 12px;border-radius:99px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);color:#fff;
}

.c-body{padding:20px}
.c-body h3{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.c-body .desc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:16px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* progress bar */
.c-progress{margin-bottom:14px}
.c-progress-bar{
  height:6px;border-radius:99px;background:var(--line);overflow:hidden;
}
.c-progress-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--green-val));
  transition:width .4s ease;
}
.c-progress-text{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;font-weight:600;color:var(--muted);margin-top:6px;
}
.c-progress-text .pct{color:var(--green-val)}

.c-meta{
  display:flex;align-items:center;gap:14px;
  font-size:12px;color:var(--faint);
  padding-top:14px;border-top:1px solid var(--line);
}
.c-meta .mi{display:flex;align-items:center;gap:4px}
.c-meta .mi svg{width:13px;height:13px}
.c-meta .free{margin-left:auto;color:var(--green-val);font-weight:700}

/* ── Course detail panel ── */
.c-detail{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:none;
}
.c-detail.open{display:block}
.c-detail-head{
  padding:24px 24px 18px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
}
.c-detail-head h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.c-detail-head .info{font-size:13px;color:var(--muted);margin-top:4px}
.c-detail-head .close-btn{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:var(--card-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);transition:color .15s,border-color .15s;
}
.c-detail-head .close-btn:hover{color:#fff;border-color:var(--accent)}
.c-detail-head .close-btn svg{width:16px;height:16px}

/* chapter progress bar in detail */
.c-detail-progress{padding:0 24px 16px}
.c-detail-progress .c-progress-bar{height:4px}

/* chapter list */
.ch-list{padding:4px 0}
.ch{
  display:flex;align-items:center;gap:14px;
  padding:14px 24px;
  transition:background .12s;
  cursor:pointer;text-decoration:none;color:inherit;
  position:relative;
}
.ch:hover{background:rgba(255,255,255,.025)}
.ch.completed{opacity:.7}
.ch.completed .ch-title{text-decoration:line-through;text-decoration-color:var(--faint)}
.ch-num{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
}
.ch-info{flex:1;min-width:0}
.ch-title{font-size:13.5px;font-weight:600;color:var(--ink)}
.ch-sub{font-size:11.5px;color:var(--faint);margin-top:1px}
.ch-actions{display:flex;align-items:center;gap:8px}

.ch-check{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  border:1.5px solid var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;color:transparent;
}
.ch-check:hover{border-color:var(--green-val);background:var(--green-soft)}
.ch-check.done{
  border-color:var(--green-val);background:var(--green-soft);color:var(--green-val);
}
.ch-check svg{width:14px;height:14px}

.ch-play{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:var(--accent-soft);border:1px solid rgba(91,116,255,.25);
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .15s;
}
.ch-play svg{width:12px;height:12px}
.ch:hover .ch-play{background:rgba(91,116,255,.25);transform:scale(1.06)}

/* ── Empty state ── */
.c-empty{
  text-align:center;padding:80px 24px;
}
.c-empty .icon{font-size:48px;margin-bottom:16px;opacity:.4}
.c-empty h3{font-size:18px;font-weight:700;margin-bottom:6px}
.c-empty p{font-size:14px;color:var(--muted)}

/* ── Loading skeleton ── */
.c-skeleton{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.c-skeleton .skel-banner{height:160px;background:linear-gradient(90deg,var(--card-2) 25%,var(--line) 50%,var(--card-2) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite}
.c-skeleton .skel-body{padding:20px}
.c-skeleton .skel-line{height:14px;border-radius:6px;
  background:linear-gradient(90deg,var(--card-2) 25%,var(--line) 50%,var(--card-2) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:10px}
.c-skeleton .skel-line.w60{width:60%}
.c-skeleton .skel-line.w80{width:80%}
.c-skeleton .skel-line.w40{width:40%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Responsive ── */
@media(max-width:680px){
  .c-grid{grid-template-columns:1fr}
  .c-header{flex-direction:column}
  .c-stats{gap:12px}
  .c-stat{padding:10px 14px;min-width:70px}
  .c-stat .num{font-size:18px}
  .c-detail-head{padding:18px 16px 14px}
  .ch{padding:12px 16px}
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar"></header>

    <main class="content">

      <!-- Header -->
      <div class="c-header">
        <div>
          <h1>Courses</h1>
          <p class="sub">Master the markets — from beginner fundamentals to advanced strategies.</p>
        </div>
        <div class="c-stats">
          <div class="c-stat">
            <div class="num" id="statCourses">—</div>
            <div class="lbl">Courses</div>
          </div>
          <div class="c-stat">
            <div class="num" id="statLessons">—</div>
            <div class="lbl">Lessons</div>
          </div>
          <div class="c-stat">
            <div class="num" id="statProgress">0%</div>
            <div class="lbl">Complete</div>
          </div>
        </div>
      </div>

      <!-- Course grid (populated by JS) -->
      <div class="c-grid" id="courseGrid">
        <!-- Loading skeletons -->
        <div class="c-skeleton"><div class="skel-banner"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
        <div class="c-skeleton"><div class="skel-banner"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
        <div class="c-skeleton"><div class="skel-banner"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
      </div>

      <!-- Detail panel (shown when a course is clicked) -->
      <div class="c-detail" id="courseDetail"></div>

    </main>
  </div>
</div>

<script src="shared-shell.js"></script>
<script>
WIN.initShell({ activePage: 'courses' });

/* ================================================================
   State
   ================================================================ */
let courses = [];
let chapters = {};   // { courseId: [...chapters] }
let progress = {};   // { chapterId: true }
let openCourseId = null;
let userId = null;   // set after auth is wired up

/* ================================================================
   Course visuals — gradient + icon + level per sort_order
   ================================================================ */
const COURSE_THEMES = [
  { gradient:'linear-gradient(135deg,#0a1628 0%,#142952 40%,#2a5aad 100%)', icon:'\u{1F4C8}', level:'beginner',     color:'var(--green-val)',  numBg:'rgba(53,215,155,.12)' },
  { gradient:'linear-gradient(135deg,#140a28 0%,#2d1452 40%,#6b3fad 100%)', icon:'\u{1F4C9}', level:'intermediate', color:'var(--accent)',     numBg:'var(--accent-soft)' },
  { gradient:'linear-gradient(135deg,#1a1a06 0%,#3d3510 40%,#ad8a2a 100%)', icon:'⚡',    level:'advanced',     color:'var(--purple-val)', numBg:'var(--purple-soft)' },
];

/* ================================================================
   Fetch data via API endpoints (server-side Supabase key)
   Falls back to demo data if API isn't available
   ================================================================ */
async function loadData() {
  try {
    const res = await fetch('/api/courses');
    if (!res.ok) throw new Error('API error');
    const data = await res.json();

    courses = data.courses || [];
    (data.chapters || []).forEach(ch => {
      if (!chapters[ch.course_id]) chapters[ch.course_id] = [];
      chapters[ch.course_id].push(ch);
    });

    // Load progress if user is logged in
    if (userId) {
      const progRes = await fetch(`/api/progress?user_id=${userId}`);
      if (progRes.ok) {
        const progData = await progRes.json();
        (progData.progress || []).forEach(p => { progress[p.chapter_id] = true; });
      }
    }
  } catch {
    loadDemoData();
  }

  render();
}

function loadDemoData() {
  const cIntro = 'demo-intro';
  const cForex = 'demo-forex';
  const cSynth = 'demo-synth';

  courses = [
    { id: cIntro, title: 'Introduction to WIN Trading', description: 'Start your trading journey here. Learn the fundamentals of forex — from registering with a broker to understanding pips, leverage, lot sizes, and how to use MT5 & TradingView.', sort_order: 1 },
    { id: cForex, title: "Hanré's Forex Course",     description: 'Take your trading to the next level with technical analysis. Master candlestick patterns, trendlines, support & resistance, order blocks, fair value gaps, and Fibonacci retracements.', sort_order: 2 },
    { id: cSynth, title: "Hanré's Synthetics Course", description: 'Explore the world of synthetic indices trading. From the basics to advanced strategies — learn how to trade volatility indices with confidence.', sort_order: 3 },
  ];

  chapters[cIntro] = [
    { id:'c1-1',  course_id:cIntro, chapter_num:'1.1',  title:'Introduction to Win',              description:'Welcome & overview of WIN Trading',     video_url:'https://youtu.be/M3FKBMtLFAI' },
    { id:'c1-2',  course_id:cIntro, chapter_num:'1.2',  title:'How to Register with JP Markets',   description:'Dashboard setup & broker registration',  video_url:'https://youtu.be/piS43eTDNsA' },
    { id:'c1-3',  course_id:cIntro, chapter_num:'1.3',  title:'What is Forex Trading',             description:'Understanding the forex market',          video_url:'https://youtu.be/8zFExpPAv_8' },
    { id:'c1-4',  course_id:cIntro, chapter_num:'1.4',  title:'What are Spreads',                  description:'Bid/ask spreads explained',               video_url:'https://youtu.be/d2sd1-kzv-4' },
    { id:'c1-5',  course_id:cIntro, chapter_num:'1.5',  title:'Lot Sizes',                         description:'Understanding position sizing',            video_url:'https://youtu.be/tDt-9oA665o' },
    { id:'c1-6',  course_id:cIntro, chapter_num:'1.6',  title:'Leverage',                          description:'How leverage works in trading',            video_url:'https://youtu.be/NBo0iILFFmE' },
    { id:'c1-7',  course_id:cIntro, chapter_num:'1.7',  title:'Take Profit & Stop Loss',           description:'Managing risk on every trade',             video_url:'https://youtu.be/2xGfBQ-A-I4' },
    { id:'c1-8',  course_id:cIntro, chapter_num:'1.8',  title:'Market Orders',                     description:'Executing trades in the market',           video_url:'https://youtu.be/vjYzCWmDuHc' },
    { id:'c1-9',  course_id:cIntro, chapter_num:'1.9',  title:'Pips',                              description:'Measuring price movement',                 video_url:'https://youtu.be/8ayZkaeh7tU' },
    { id:'c1-10', course_id:cIntro, chapter_num:'1.10', title:'How MT5 Works',                     description:'Navigating MetaTrader 5',                  video_url:'https://youtu.be/54eKLMdNZMw' },
    { id:'c1-11', course_id:cIntro, chapter_num:'1.11', title:'TradingView',                       description:'Charting & analysis platform',             video_url:'https://youtu.be/TaP_f9AhjjQ' },
    { id:'c1-12', course_id:cIntro, chapter_num:'1.12', title:'Real & Demo Accounts',              description:'Practice vs live trading',                 video_url:'https://youtu.be/p1Xf0HrJsQE' },
  ];

  chapters[cForex] = [
    { id:'c2-1',  course_id:cForex, chapter_num:'1',  title:'Candles',              description:'Reading candlestick charts',     video_url:'https://youtu.be/DcpnFbOmT7A' },
    { id:'c2-2',  course_id:cForex, chapter_num:'2',  title:'Patterns',             description:'Identifying chart patterns',     video_url:'https://youtu.be/2eRxD2exvpo' },
    { id:'c2-3',  course_id:cForex, chapter_num:'3',  title:'Trendlines',           description:'Drawing & trading trendlines',   video_url:'https://youtu.be/tq9xjZbTPyQ' },
    { id:'c2-4',  course_id:cForex, chapter_num:'4',  title:'Support & Resistance', description:'Key price levels',               video_url:'https://youtu.be/4OZ0QojFp4E' },
    { id:'c2-5',  course_id:cForex, chapter_num:'5',  title:'Retests',              description:'Confirmation through retests',   video_url:'https://youtu.be/LSImmLMmma8' },
    { id:'c2-6',  course_id:cForex, chapter_num:'6',  title:'Example Trades',       description:'Real trade setups walkthrough',  video_url:'https://youtu.be/BV9wsRbDwRI' },
    { id:'c2-7',  course_id:cForex, chapter_num:'7',  title:'Order Blocks',         description:'Smart money concepts',           video_url:'https://youtu.be/pQ0F4VTjz8Y' },
    { id:'c2-8',  course_id:cForex, chapter_num:'8',  title:'Fair Value Gaps',      description:'Imbalance & liquidity zones',    video_url:'https://youtu.be/O1ORrqhUZ6o' },
    { id:'c2-9',  course_id:cForex, chapter_num:'9',  title:'Break of Structure',   description:'Market structure shifts',        video_url:'https://youtu.be/SUOT7gmXF0o' },
    { id:'c2-10', course_id:cForex, chapter_num:'10', title:'Fibonacci',            description:'Fibonacci retracement levels',   video_url:'https://youtu.be/8JdlgLTwVLU' },
    { id:'c2-11', course_id:cForex, chapter_num:'11', title:'Example Trades',       description:'Advanced trade examples',        video_url:'https://youtu.be/klrX0e4RwMw' },
  ];

  chapters[cSynth] = [
    { id:'c3-1', course_id:cSynth, chapter_num:'1', title:'The Basics', description:'Introduction to synthetic indices', video_url:'https://youtu.be/e8kpztbHn34' },
    { id:'c3-2', course_id:cSynth, chapter_num:'2', title:'Advanced',   description:'Advanced synthetics strategies',    video_url:'https://youtu.be/yh6b27lz7d8' },
  ];
}

/* ================================================================
   Render
   ================================================================ */
function render() {
  const grid = document.getElementById('courseGrid');

  if (!courses.length) {
    grid.innerHTML = '<div class="c-empty"><div class="icon">\u{1F4DA}</div><h3>No courses yet</h3><p>Courses will appear here once they\'re published.</p></div>';
    return;
  }

  let totalChapters = 0;
  let totalDone = 0;
  courses.forEach(c => {
    const chs = chapters[c.id] || [];
    totalChapters += chs.length;
    chs.forEach(ch => { if (progress[ch.id]) totalDone++; });
  });

  document.getElementById('statCourses').textContent = courses.length;
  document.getElementById('statLessons').textContent = totalChapters;
  document.getElementById('statProgress').textContent = totalChapters ? Math.round((totalDone / totalChapters) * 100) + '%' : '0%';

  grid.innerHTML = courses.map((c, i) => {
    const theme = COURSE_THEMES[i % COURSE_THEMES.length];
    const chs = chapters[c.id] || [];
    const done = chs.filter(ch => progress[ch.id]).length;
    const pct = chs.length ? Math.round((done / chs.length) * 100) : 0;

    return `
      <div class="c-card" onclick="toggleCourse('${c.id}')">
        <div class="c-banner">
          <div class="grad" style="background:${theme.gradient}"></div>
          <span class="icon">${theme.icon}</span>
          <span class="c-badge ${theme.level}">${theme.level}</span>
          <span class="c-count">${chs.length} chapter${chs.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="c-body">
          <h3>${esc(c.title)}</h3>
          <p class="desc">${esc(c.description)}</p>
          ${chs.length ? `
          <div class="c-progress">
            <div class="c-progress-bar"><div class="c-progress-fill" style="width:${pct}%"></div></div>
            <div class="c-progress-text"><span>${done} / ${chs.length} completed</span><span class="pct">${pct}%</span></div>
          </div>` : ''}
          <div class="c-meta">
            <span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${chs.length} lessons</span>
            <span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg> ${theme.level.charAt(0).toUpperCase() + theme.level.slice(1)}</span>
            <span class="free">FREE</span>
          </div>
        </div>
      </div>`;
  }).join('');

  if (openCourseId) renderDetail(openCourseId);
}

function renderDetail(courseId) {
  const detail = document.getElementById('courseDetail');
  const course = courses.find(c => c.id === courseId);
  if (!course) { detail.classList.remove('open'); return; }

  const idx = courses.indexOf(course);
  const theme = COURSE_THEMES[idx % COURSE_THEMES.length];
  const chs = chapters[courseId] || [];
  const done = chs.filter(ch => progress[ch.id]).length;
  const pct = chs.length ? Math.round((done / chs.length) * 100) : 0;

  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 12 5 5L20 7"/></svg>';
  const playSvg = '<svg viewBox="0 0 24 24" fill="var(--accent)"><path d="M8 5v14l11-7z"/></svg>';

  detail.innerHTML = `
    <div class="c-detail-head">
      <div>
        <h2>${esc(course.title)}</h2>
        <p class="info">${chs.length} chapters · ${done} completed · ${pct}% done</p>
      </div>
      <button class="close-btn" onclick="toggleCourse('${courseId}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="c-detail-progress">
      <div class="c-progress-bar"><div class="c-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="ch-list">
      ${chs.map(ch => {
        const isDone = progress[ch.id];
        return `
        <div class="ch${isDone ? ' completed' : ''}">
          <div class="ch-num" style="background:${theme.numBg};color:${theme.color}">${esc(ch.chapter_num)}</div>
          <div class="ch-info">
            <div class="ch-title">${esc(ch.title)}</div>
            <div class="ch-sub">${esc(ch.description)}</div>
          </div>
          <div class="ch-actions">
            <button class="ch-check${isDone ? ' done' : ''}" onclick="event.stopPropagation();toggleProgress('${ch.id}')" title="${isDone ? 'Mark incomplete' : 'Mark complete'}">
              ${checkSvg}
            </button>
            <a class="ch-play" href="${esc(ch.video_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Watch video">
              ${playSvg}
            </a>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  detail.classList.add('open');
}

function toggleCourse(id) {
  const detail = document.getElementById('courseDetail');
  if (openCourseId === id) {
    detail.classList.remove('open');
    openCourseId = null;
    return;
  }
  openCourseId = id;
  renderDetail(id);
  setTimeout(() => detail.scrollIntoView({ behavior:'smooth', block:'start' }), 80);
}

/* ================================================================
   Progress toggle — calls /api/progress
   ================================================================ */
async function toggleProgress(chapterId) {
  if (progress[chapterId]) {
    delete progress[chapterId];
    if (userId) {
      fetch('/api/progress', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, chapter_id: chapterId }),
      });
    }
  } else {
    progress[chapterId] = true;
    if (userId) {
      fetch('/api/progress', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, chapter_id: chapterId }),
      });
    }
  }
  render();
}

/* ================================================================
   Utils
   ================================================================ */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/* ── Boot ── */
loadData();
