<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIN · Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
/* ── Courses page styles ── */

.c-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  margin-bottom:8px;
}
.c-header h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.c-header .sub{font-size:14px;color:var(--muted);margin-top:4px}
.c-stats{display:flex;gap:20px}
.c-stat{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 20px;text-align:center;min-width:90px;
}
.c-stat .num{font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff}
.c-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}

/* course grid */
.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}

/* course card */
.c-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.c-card:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 48px -16px rgba(0,0,0,.5);
  border-color:rgba(255,255,255,.12);
}
.c-banner{
  height:160px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.c-banner .grad{position:absolute;inset:0}
.c-banner .icon{position:relative;font-size:42px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4))}
.c-badge{
  position:absolute;top:12px;left:12px;
  font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.4px;
}
.c-badge.beginner{background:rgba(53,215,155,.14);color:var(--green-val);border:1px solid rgba(53,215,155,.3)}
.c-badge.intermediate{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(91,116,255,.3)}
.c-badge.advanced{background:var(--purple-soft);color:var(--purple-val);border:1px solid rgba(168,130,255,.3)}
.c-count{
  position:absolute;top:12px;right:12px;
  font-size:11px;font-weight:600;padding:5px 12px;border-radius:99px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);color:#fff;
}

.c-body{padding:20px}
.c-body h3{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.c-body .desc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:16px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* progress bar */
.c-progress{margin-bottom:14px}
.c-progress-bar{
  height:6px;border-radius:99px;background:var(--line);overflow:hidden;
}
.c-progress-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--green-val));
  transition:width .4s ease;
}
.c-progress-text{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;font-weight:600;color:var(--muted);margin-top:6px;
}
.c-progress-text .pct{color:var(--green-val)}

.c-meta{
  display:flex;align-items:center;gap:14px;
  font-size:12px;color:var(--faint);
  padding-top:14px;border-top:1px solid var(--line);
}
.c-meta .mi{display:flex;align-items:center;gap:4px}
.c-meta .mi svg{width:13px;height:13px}
.c-meta .free{margin-left:auto;color:var(--green-val);font-weight:700}

/* ── Detail view ── */
.dv{display:none;animation:fadeUp .25s ease}
.dv.open{display:block}

.dv-breadcrumb{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--muted);margin-bottom:20px;
}
.dv-back{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);
  font:500 13px 'Inter';color:var(--ink-2);
  cursor:pointer;transition:border-color .15s,color .15s;
}
.dv-back:hover{border-color:var(--accent);color:#fff}
.dv-back svg{width:14px;height:14px}
.dv-bc-sep{color:var(--faint)}
.dv-bc-cur{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}

.dv-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  margin-bottom:20px;
}
.dv-header h1{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.dv-header .dv-meta{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:13px;color:var(--muted);margin-top:8px;
}
.dv-header .dv-meta span{display:flex;align-items:center;gap:5px}
.dv-header .dv-meta svg{width:14px;height:14px}

.dv-layout{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:20px;
  align-items:start;
}

/* Video */
.dv-video-wrap{
  position:relative;width:100%;padding-bottom:56.25%;
  background:#000;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);
}
.dv-video-wrap iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;
}
.dv-video-placeholder{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--card-2);color:var(--muted);font-size:14px;text-align:center;padding:20px;
}
.dv-video-placeholder svg{width:48px;height:48px;opacity:.3}

/* Now playing */
.dv-now-playing{
  margin-top:14px;padding:14px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  display:flex;align-items:center;gap:12px;
}
.dv-np-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);flex-shrink:0;
  box-shadow:0 0 8px var(--accent);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.dv-np-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.dv-np-title{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:1px}

/* Tabs */
.dv-tabs{
  display:flex;gap:4px;margin-top:16px;
  border-bottom:1px solid var(--line);padding-bottom:0;
}
.dv-tab{
  padding:10px 18px;border-radius:10px 10px 0 0;
  font:500 13px 'Inter';color:var(--muted);
  cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s;
}
.dv-tab:hover{color:var(--ink)}
.dv-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.dv-tab-body{padding:20px 0}
.dv-tab-body h3{font-size:16px;font-weight:700;margin-bottom:10px}
.dv-tab-body p{font-size:14px;color:var(--muted);line-height:1.7}

/* Progress in overview */
.dv-prog-row{
  display:flex;align-items:center;gap:14px;
  margin-top:20px;padding:16px;
  background:var(--card-2);border:1px solid var(--line);border-radius:12px;
}
.dv-prog-row .pct-big{font-size:28px;font-weight:800;color:var(--green-val);flex-shrink:0}
.dv-prog-row .pct-info{flex:1}
.dv-prog-row .pct-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.dv-prog-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.dv-prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--green-val));transition:width .4s}

/* Sidebar */
.dv-sidebar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;position:sticky;top:20px;max-height:calc(100vh - 160px);
  display:flex;flex-direction:column;
}
.dv-sidebar-head{
  padding:18px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.dv-sidebar-head h3{font-size:15px;font-weight:700}
.dv-sidebar-meta{font-size:12px;color:var(--muted)}
.dv-ch-list{overflow-y:auto;flex:1}

/* Chapter rows */
.dv-ch{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;cursor:pointer;
  transition:background .12s;border-bottom:1px solid rgba(255,255,255,.04);
}
.dv-ch:hover{background:rgba(255,255,255,.035)}
.dv-ch.active{background:var(--accent-soft);border-left:3px solid var(--accent)}
.dv-ch.active .dv-ch-num{background:var(--accent);color:#fff}
.dv-ch-num{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;background:var(--card-2);color:var(--muted);
  transition:background .15s,color .15s;
}
.dv-ch-info{flex:1;min-width:0}
.dv-ch-title{
  font-size:13px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dv-ch.completed .dv-ch-title{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--faint)}
.dv-ch-sub{font-size:11px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-ch-check{
  width:26px;height:26px;border-radius:7px;flex-shrink:0;
  border:1.5px solid var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;color:transparent;
}
.dv-ch-check:hover{border-color:var(--green-val)}
.dv-ch-check.done{border-color:var(--green-val);background:var(--green-soft);color:var(--green-val)}
.dv-ch-check svg{width:13px;height:13px}

/* ── Empty state ── */
.c-empty{
  text-align:center;padding:80px 24px;
}
.c-empty .icon{font-size:48px;margin-bottom:16px;opacity:.4}
.c-empty h3{font-size:18px;font-weight:700;margin-bottom:6px}
.c-empty p{font-size:14px;color:var(--muted)}

/* ── Loading skeleton ── */
.c-skeleton{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.c-skeleton .skel-banner{height:160px;background:linear-gradient(90deg,var(--card-2) 25%,var(--line) 50%,var(--card-2) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite}
.c-skeleton .skel-body{padding:20px}
.c-skeleton .skel-line{height:14px;border-radius:6px;
  background:linear-gradient(90deg,var(--card-2) 25%,var(--line) 50%,var(--card-2) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:10px}
.c-skeleton .skel-line.w60{width:60%}
.c-skeleton .skel-line.w80{width:80%}
.c-skeleton .skel-line.w40{width:40%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Responsive ── */
@media(max-width:900px){
  .dv-layout{grid-template-columns:1fr}
  .dv-sidebar{position:static;max-height:none}
  .dv-ch-list{max-height:420px}
}
@media(max-width:680px){
  .c-grid{grid-template-columns:1fr}
  .c-header{flex-direction:column}
  .c-stats{gap:10px}
  .c-stat{padding:10px 14px;min-width:70px}
  .c-stat .num{font-size:18px}
  .dv-header{flex-direction:column;gap:10px}
  .dv-header h1{font-size:19px}
  .dv-breadcrumb{flex-wrap:wrap}
  .dv-bc-cur{max-width:180px}
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar"></header>

    <main class="content">

      <!-- ── Grid view ── -->
      <div id="gridView">
        <div class="c-header">
          <div>
            <h1>Courses</h1>
            <p class="sub">Master the markets — from beginner fundamentals to advanced strategies.</p>
          </div>
          <div class="c-stats">
            <div class="c-stat"><div class="num" id="statCourses">—</div><div class="lbl">Courses</div></div>
            <div class="c-stat"><div class="num" id="statLessons">—</div><div class="lbl">Lessons</div></div>
            <div class="c-stat"><div class="num" id="statProgress">0%</div><div class="lbl">Complete</div></div>
          </div>
        </div>
        <div class="c-grid" id="courseGrid">
          <div class="c-skeleton"><div class="skel-banner"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
          <div class="c-skeleton"><div class="skel-banner"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
          <div class="c-skeleton"><div class="skel-banner"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
        </div>
      </div>

      <!-- ── Detail view ── -->
      <div class="dv" id="detailView">

        <!-- Breadcrumb -->
        <div class="dv-breadcrumb">
          <button class="dv-back" onclick="closeDetail()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Courses
          </button>
          <span class="dv-bc-sep">/</span>
          <span class="dv-bc-cur" id="dvBreadTitle"></span>
        </div>

        <!-- Course title -->
        <div class="dv-header">
          <div>
            <h1 id="dvTitle"></h1>
            <div class="dv-meta" id="dvMeta"></div>
          </div>
        </div>

        <!-- Two-column layout -->
        <div class="dv-layout">

          <!-- Left: video + tabs -->
          <div class="dv-main">
            <div class="dv-video-wrap" id="dvVideoWrap">
              <div class="dv-video-placeholder" id="dvVideoPlaceholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>
                <span>Select a chapter to watch</span>
              </div>
            </div>

            <!-- Now playing -->
            <div class="dv-now-playing" id="dvNowPlaying" style="display:none">
              <div class="dv-np-dot"></div>
              <div>
                <div class="dv-np-label">Now playing</div>
                <div class="dv-np-title" id="dvNowTitle"></div>
              </div>
            </div>

            <!-- Tabs -->
            <div class="dv-tabs">
              <button class="dv-tab active">Overview</button>
            </div>
            <div class="dv-tab-body">
              <h3>About this course</h3>
              <p id="dvDesc"></p>
              <div id="dvProgRow"></div>
            </div>
          </div>

          <!-- Right: chapter list -->
          <div class="dv-sidebar">
            <div class="dv-sidebar-head">
              <h3>Course content</h3>
              <span class="dv-sidebar-meta" id="dvSidebarMeta"></span>
            </div>
            <div class="dv-ch-list" id="dvChList"></div>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<script src="shared-shell.js"></script>
<script>
WIN.initShell({ activePage: 'courses' });

/* ================================================================
   State
   ================================================================ */
let courses = [];
let chapters = {};   // { courseId: [...chapters] }
let progress = {};   // { chapterId: true }
let openCourseId = null;
let userId = null;   // set after auth is wired up

/* ================================================================
   Course visuals — gradient + icon + level per sort_order
   ================================================================ */
const COURSE_THEMES = [
  { gradient:'linear-gradient(135deg,#0a1628 0%,#142952 40%,#2a5aad 100%)', icon:'\u{1F4C8}', level:'beginner',     color:'var(--green-val)',  numBg:'rgba(53,215,155,.12)' },
  { gradient:'linear-gradient(135deg,#140a28 0%,#2d1452 40%,#6b3fad 100%)', icon:'\u{1F4C9}', level:'intermediate', color:'var(--accent)',     numBg:'var(--accent-soft)' },
  { gradient:'linear-gradient(135deg,#1a1a06 0%,#3d3510 40%,#ad8a2a 100%)', icon:'⚡',    level:'advanced',     color:'var(--purple-val)', numBg:'var(--purple-soft)' },
];

/* ================================================================
   Fetch data from API
   ================================================================ */
async function loadData() {
  const res = await fetch('/api/courses');
  if (!res.ok) { renderGrid(); return; }
  const data = await res.json();

  courses = data.courses || [];
  (data.chapters || []).forEach(ch => {
    if (!chapters[ch.course_id]) chapters[ch.course_id] = [];
    chapters[ch.course_id].push(ch);
  });

  if (userId) {
    const progRes = await fetch(`/api/progress?user_id=${userId}`);
    if (progRes.ok) {
      const progData = await progRes.json();
      (progData.progress || []).forEach(p => { progress[p.chapter_id] = true; });
    }
  }

  renderGrid();
}

/* ================================================================
   Render grid view
   ================================================================ */
function renderGrid() {
  const grid = document.getElementById('courseGrid');

  if (!courses.length) {
    grid.innerHTML = '<div class="c-empty"><div class="icon">\u{1F4DA}</div><h3>No courses yet</h3><p>Courses will appear here once they\'re published.</p></div>';
    return;
  }

  let totalChapters = 0, totalDone = 0;
  courses.forEach(c => {
    const chs = chapters[c.id] || [];
    totalChapters += chs.length;
    chs.forEach(ch => { if (progress[ch.id]) totalDone++; });
  });

  document.getElementById('statCourses').textContent = courses.length;
  document.getElementById('statLessons').textContent = totalChapters;
  document.getElementById('statProgress').textContent = totalChapters ? Math.round((totalDone / totalChapters) * 100) + '%' : '0%';

  grid.innerHTML = courses.map((c, i) => {
    const theme = COURSE_THEMES[i % COURSE_THEMES.length];
    const chs = chapters[c.id] || [];
    const done = chs.filter(ch => progress[ch.id]).length;
    const pct = chs.length ? Math.round((done / chs.length) * 100) : 0;
    return `
      <div class="c-card" onclick="openDetail('${c.id}')">
        <div class="c-banner">
          <div class="grad" style="background:${theme.gradient}"></div>
          <span class="icon">${theme.icon}</span>
          <span class="c-badge ${theme.level}">${theme.level}</span>
          <span class="c-count">${chs.length} chapter${chs.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="c-body">
          <h3>${esc(c.title)}</h3>
          <p class="desc">${esc(c.description)}</p>
          ${chs.length ? `
          <div class="c-progress">
            <div class="c-progress-bar"><div class="c-progress-fill" style="width:${pct}%"></div></div>
            <div class="c-progress-text"><span>${done} / ${chs.length} completed</span><span class="pct">${pct}%</span></div>
          </div>` : ''}
          <div class="c-meta">
            <span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${chs.length} lessons</span>
            <span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>${theme.level.charAt(0).toUpperCase() + theme.level.slice(1)}</span>
            <span class="free">FREE</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ================================================================
   Open course detail view
   ================================================================ */
function openDetail(courseId) {
  const course = courses.find(c => c.id === courseId);
  if (!course) return;

  openCourseId = courseId;
  const idx = courses.indexOf(course);
  const theme = COURSE_THEMES[idx % COURSE_THEMES.length];
  const chs = chapters[courseId] || [];
  const done = chs.filter(ch => progress[ch.id]).length;
  const pct = chs.length ? Math.round((done / chs.length) * 100) : 0;

  document.getElementById('dvBreadTitle').textContent = course.title;
  document.getElementById('dvTitle').textContent = course.title;
  document.getElementById('dvMeta').innerHTML = `
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${chs.length} lessons</span>
    <span class="c-badge ${theme.level}" style="position:static">${theme.level}</span>
    <span style="color:var(--green-val);font-weight:700">FREE</span>`;

  document.getElementById('dvDesc').textContent = course.description || '';
  document.getElementById('dvProgRow').innerHTML = chs.length ? `
    <div class="dv-prog-row">
      <div class="pct-big">${pct}%</div>
      <div class="pct-info">
        <div class="pct-label">${done} of ${chs.length} chapters completed</div>
        <div class="dv-prog-bar"><div class="dv-prog-fill" style="width:${pct}%"></div></div>
      </div>
    </div>` : '';

  document.getElementById('dvSidebarMeta').textContent = `${done}/${chs.length} done`;

  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 12 5 5L20 7"/></svg>';
  document.getElementById('dvChList').innerHTML = chs.map(ch => {
    const isDone = progress[ch.id];
    return `
      <div class="dv-ch${isDone ? ' completed' : ''}" id="dch-${ch.id}" onclick="playChapter('${ch.id}','${courseId}')">
        <div class="dv-ch-num">${esc(ch.chapter_num)}</div>
        <div class="dv-ch-info">
          <div class="dv-ch-title">${esc(ch.title)}</div>
          <div class="dv-ch-sub">${esc(ch.description)}</div>
        </div>
        <button class="dv-ch-check${isDone ? ' done' : ''}"
          onclick="event.stopPropagation();toggleProgress('${ch.id}','${courseId}')"
          title="${isDone ? 'Mark incomplete' : 'Mark complete'}">
          ${checkSvg}
        </button>
      </div>`;
  }).join('');

  setVideoPlaceholder();
  if (chs.length) playChapter(chs[0].id, courseId);

  document.getElementById('gridView').style.display = 'none';
  document.getElementById('detailView').classList.add('open');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('open');
  document.getElementById('gridView').style.display = 'block';
  setVideoPlaceholder();
  openCourseId = null;
}

/* ================================================================
   Video player
   ================================================================ */
function getYtId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|[?&]v=)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function setVideoPlaceholder() {
  const old = document.getElementById('dvVideoFrame');
  if (old) old.remove();
  const ph = document.getElementById('dvVideoPlaceholder');
  if (ph) ph.style.display = 'flex';
  document.getElementById('dvNowPlaying').style.display = 'none';
  document.querySelectorAll('.dv-ch').forEach(el => el.classList.remove('active'));
}

function playChapter(chId, courseId) {
  const ch = (chapters[courseId] || []).find(c => c.id === chId);
  if (!ch) return;

  const ytId = getYtId(ch.video_url);
  const wrap = document.getElementById('dvVideoWrap');
  const ph = document.getElementById('dvVideoPlaceholder');

  const old = document.getElementById('dvVideoFrame');
  if (old) old.remove();

  if (ytId) {
    if (ph) ph.style.display = 'none';
    const iframe = document.createElement('iframe');
    iframe.id = 'dvVideoFrame';
    iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
    wrap.appendChild(iframe);
  } else {
    if (ph) ph.style.display = 'flex';
  }

  document.getElementById('dvNowTitle').textContent = ch.title;
  document.getElementById('dvNowPlaying').style.display = 'flex';

  document.querySelectorAll('.dv-ch').forEach(el => el.classList.remove('active'));
  const active = document.getElementById('dch-' + chId);
  if (active) active.classList.add('active');
}

/* ================================================================
   Progress toggle
   ================================================================ */
async function toggleProgress(chapterId, courseId) {
  if (progress[chapterId]) {
    delete progress[chapterId];
    if (userId) fetch('/api/progress', { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ user_id:userId, chapter_id:chapterId }) });
  } else {
    progress[chapterId] = true;
    if (userId) fetch('/api/progress', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ user_id:userId, chapter_id:chapterId }) });
  }
  if (openCourseId) openDetail(openCourseId);
  else renderGrid();
}

/* ================================================================
   Utils
   ================================================================ */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/* ── Boot ── */
loadData();
</script>
</body>
</html>
