<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIN · Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar"></header>

    <main class="content">
      <div class="card cal">
        <div class="cal-head">
          <button class="nav-btn" id="prevM" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg></button>
          <div class="cal-title" id="calTitle">June <span>2026</span></div>
          <button class="nav-btn" id="nextM" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg></button>
          <div class="grow"></div>
          <div class="summary" id="summary"></div>
          <button class="kebab" aria-label="Options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
        </div>
        <div class="cal-scroll"><div class="cal-grid" id="calGrid"></div></div>
      </div>

      <!-- Trading History -->
      <div class="card th-card">
        <div class="th-head">
          <h2>Trading History</h2>
          <div class="th-actions">
            <span class="th-badge" id="thCount"></span>
            <div class="th-dots" id="thDots">
              <button class="th-dots-btn" id="thDotsBtn" aria-label="Page size">
                <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
              </button>
              <div class="th-dots-menu" id="thDotsMenu">
                <div class="dm-label">Rows per page</div>
                <button data-pp="10" class="sel">10<span class="ck">✓</span></button>
                <button data-pp="25">25<span class="ck"></span></button>
                <button data-pp="50">50<span class="ck"></span></button>
                <button data-pp="100">100<span class="ck"></span></button>
              </div>
            </div>
          </div>
        </div>
        <div class="th-scroll">
          <table class="th-table">
            <thead><tr>
              <th>Date</th><th>Symbol</th><th>Net PNL</th>
              <th>Qty</th><th>Commission</th><th>Duration</th><th>Type</th><th></th>
            </tr></thead>
            <tbody id="thBody"></tbody>
          </table>
        </div>
        <div class="th-cards" id="thCards"></div>
        <div class="th-pag" id="thPag"></div>
      </div>
    </main>
  </div>

</div>

<!-- Day summary modal -->
<div class="modal" id="modal">
  <div class="m-card">
    <button class="m-close" id="mClose" aria-label="Close">×</button>
    <h3 class="m-date" id="mDate"></h3>
    <div class="m-pnl" id="mPnlWrap">
      <div class="m-pnl-label">NET P&amp;L</div>
      <div class="m-pnl-row">
        <div class="m-pnl-val" id="mPnl"></div>
        <div class="m-pnl-pct" id="mPct"></div>
      </div>
    </div>
    <div class="m-sect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 12h.01"/></svg>Account Overview</div>
    <div class="m-overview">
      <div class="m-ov"><div class="l">Start Balance</div><div class="v" id="mStart"></div></div>
      <div class="m-ov"><div class="l">End Balance</div><div class="v" id="mEnd"></div></div>
      <div class="m-ov"><div class="l">Deposit</div><div class="v" id="mDep"></div></div>
    </div>
    <div class="m-div"></div>
    <div class="m-sect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>Trade Stats</div>
    <div class="m-boxes">
      <div class="m-box buys"><div class="bn" id="mBuys"></div><div class="bl">Buys</div></div>
      <div class="m-box sells"><div class="bn" id="mSells"></div><div class="bl">Sells</div></div>
      <div class="m-box trades"><div class="bn" id="mTrades"></div><div class="bl">Trades</div></div>
    </div>
    <div class="m-rows">
      <div class="m-row"><span class="ml">Best Trade</span><span class="mv accent" id="mBest"></span></div>
      <div class="m-row"><span class="ml">Worst Trade</span><span class="mv" id="mWorst"></span></div>
      <div class="m-row"><span class="ml">Avg Hold Time</span><span class="mv neu" id="mHold"></span></div>
      <div class="m-row"><span class="ml">Max Balance Drawdown</span><span class="mv neu" id="mDD"></span></div>
      <div class="m-row"><span class="ml">Fees</span><span class="mv neu" id="mFees"></span></div>
      <div class="m-row"><span class="ml">Winrate</span><span class="mv" id="mWR"></span></div>
      <div class="m-row"><span class="ml">Profit Factor</span><span class="mv" id="mPF"></span></div>
      <div class="m-row"><span class="ml">Expectancy</span><span class="mv" id="mExp"></span></div>
    </div>
    <button class="m-journal">View In Journal</button>
  </div>
</div>

<style>
@keyframes cal-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.th-skel-cell{display:inline-block;height:13px;border-radius:5px;background:linear-gradient(90deg,var(--card-2,#0e1320) 25%,rgba(255,255,255,.05) 50%,var(--card-2,#0e1320) 75%);background-size:200% 100%;animation:cal-shimmer 1.6s infinite}
</style>
<script src="shared-shell.js"></script>
<script>
WIN.initShell({ activePage: 'calendar' });

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const fmt$=v=>{const s=v<0?"-$":"$";return s+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});};
const fmtN=v=>(v<0?"-":"")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

/* --- state --- */
let _accountId=null, _accountBalance=0, _allTransactions=[], _resolvedAccounts=[];

function parseUTC(s){
  if(!s)return null;
  const str=/[Zz+\-]\d*$/.test(s.trim())?s:s+'Z';
  return new Date(str);
}

function netPnl(t){
  return (parseFloat(t.profit)||0)+(parseFloat(t.commission)||0)+(parseFloat(t.comm_deduction)||0)+(parseFloat(t.rebates)||0);
}

function symColor(sym){
  if(!sym)return 'blue';
  return /XAU|BTC|ETH|LTC|SOL|XRP|DOGE/i.test(sym)?'amber':'blue';
}

function fmtDur(ms){
  if(!ms||ms<0)return '--';
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  if(h>0)return h+'h '+(m%60)+'m';
  if(m>0)return m+' min '+(s%60)+' sec';
  return s+' sec';
}

/* --- data helpers --- */
function getMonthData(y,m){
  const map={};
  for(const t of _allTransactions){
    const dt=parseUTC(t.close_time);
    if(!dt||dt.getFullYear()!==y||dt.getMonth()!==m)continue;
    const d=dt.getDate();
    map[d]=+((( map[d]||0)+netPnl(t)).toFixed(2));
  }
  return map;
}

function getMonthSummary(y,m){
  let trades=0,wins=0,total=0;
  for(const t of _allTransactions){
    const dt=parseUTC(t.close_time);
    if(!dt||dt.getFullYear()!==y||dt.getMonth()!==m)continue;
    trades++;const n=netPnl(t);if(n>0)wins++;total+=n;
  }
  total=+total.toFixed(2);
  const pct=_accountBalance>0?(total/_accountBalance*100).toFixed(2)+'%':'0.00%';
  return{trades,wins,profits:fmt$(total),percent:pct};
}

function getMonthTrades(y,m){
  return _allTransactions
    .filter(t=>{const dt=parseUTC(t.close_time);return dt&&dt.getFullYear()===y&&dt.getMonth()===m;})
    .map(t=>{
      const ct=parseUTC(t.close_time),ot=parseUTC(t.open_time);
      return{
        date:ct?ct.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}):'--',
        ts:ct?ct.getTime():0,
        sym:t.symbol||'--',symC:symColor(t.symbol),
        pnl:netPnl(t),qty:t.volume||0,
        comm:parseFloat(t.commission||0),
        dur:fmtDur(ct&&ot?ct-ot:0),
        type:t.type||'--'
      };
    })
    .sort((a,b)=>b.ts-a.ts);
}

/* --- Trading History --- */
const thBody=document.getElementById('thBody'),thCards=document.getElementById('thCards'),
      thCount=document.getElementById('thCount'),thPag=document.getElementById('thPag');
let thPage=0,thPerPage=10,thAllTrades=[];

function showTHSkeleton(){
  thBody.innerHTML=Array.from({length:8},()=>`<tr><td colspan="8" style="padding:10px 14px"><span class="th-skel-cell" style="width:${50+Math.floor(Math.random()*40)}%"></span></td></tr>`).join('');
  thCards.innerHTML='';thPag.innerHTML='';thCount.textContent='';
}

function renderTH(){
  thAllTrades=getMonthTrades(cy,cm);
  thCount.textContent=thAllTrades.length+' records';
  thPage=0;renderTHPage();
}

function renderTHPage(){
  const trades=thAllTrades;
  const totalPages=Math.max(1,Math.ceil(trades.length/thPerPage));
  if(thPage>=totalPages)thPage=totalPages-1;
  const start=thPage*thPerPage,end=Math.min(start+thPerPage,trades.length);
  const slice=trades.slice(start,end);
  thBody.innerHTML='';thCards.innerHTML='';
  if(!trades.length){thBody.innerHTML='<tr><td colspan="8" class="th-empty">No trades this month</td></tr>';thPag.innerHTML='';return;}
  slice.forEach(t=>{
    const pos=t.pnl>=0;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${t.date}</td>
      <td><span class="sym ${t.symC}">${t.sym}</span></td>
      <td class="${pos?'pos':'neg'}">${fmt$(t.pnl)}</td>
      <td>${t.qty}</td>
      <td>${fmt$(t.comm)}</td>
      <td>${t.dur}</td>
      <td>${t.type}</td>
      <td><button class="journal-btn">Journal</button></td>`;
    thBody.appendChild(tr);
    const card=document.createElement('div');card.className='th-card-item';
    card.innerHTML=`
      <div class="tc-top"><span class="tc-date">${t.date}</span><span class="sym ${t.symC}">${t.sym}</span></div>
      <div class="tc-grid">
        <div class="tc-row"><span class="label">Net PNL</span><span class="val ${pos?'pos':'neg'}">${fmt$(t.pnl)}</span></div>
        <div class="tc-row"><span class="label">Type</span><span class="val">${t.type}</span></div>
        <div class="tc-row"><span class="label">Qty</span><span class="val">${t.qty}</span></div>
        <div class="tc-row"><span class="label">Commission</span><span class="val">${fmt$(t.comm)}</span></div>
        <div class="tc-row"><span class="label">Duration</span><span class="val">${t.dur}</span></div>
      </div>
      <button class="tc-journal">Journal</button>`;
    thCards.appendChild(card);
  });
  const info=`${start+1}–${end} of ${trades.length}`;
  let btns='';
  btns+='<button class="pag-btn" data-p="prev"'+(thPage===0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg></button>';
  for(let i=0;i<totalPages;i++){
    if(totalPages>7&&i>1&&i<totalPages-2&&Math.abs(i-thPage)>1){if(btns.slice(-3)!=='…</span>')btns+='<span style="color:var(--faint);padding:0 4px">…</span>';continue;}
    btns+='<button class="pag-btn'+(i===thPage?' active':'')+'" data-p="'+i+'">'+(i+1)+'</button>';
  }
  btns+='<button class="pag-btn" data-p="next"'+(thPage>=totalPages-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg></button>';
  thPag.innerHTML='<span class="pag-info">'+info+'</span><div class="pag-btns">'+btns+'</div>';
}

document.getElementById('thPag').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]');if(!b||b.disabled)return;
  const v=b.dataset.p;
  if(v==='prev')thPage--;else if(v==='next')thPage++;else thPage=+v;
  renderTHPage();
});

const thDots=document.getElementById('thDots');
document.getElementById('thDotsBtn').addEventListener('click',e=>{e.stopPropagation();thDots.classList.toggle('open');});
document.getElementById('thDotsMenu').addEventListener('click',e=>{
  const b=e.target.closest('[data-pp]');if(!b)return;
  thPerPage=+b.dataset.pp;thPage=0;
  document.querySelectorAll('#thDotsMenu button').forEach(x=>{x.classList.remove('sel');x.querySelector('.ck').textContent='';});
  b.classList.add('sel');b.querySelector('.ck').textContent='✓';
  thDots.classList.remove('open');renderTHPage();
});
document.addEventListener('click',e=>{if(!e.target.closest('.th-dots'))thDots.classList.remove('open');});

/* --- Calendar --- */
let cy=new Date().getFullYear(),cm=new Date().getMonth();
const grid=document.getElementById('calGrid'),title=document.getElementById('calTitle'),summaryEl=document.getElementById('summary');

function renderCal(){
  const data=getMonthData(cy,cm);
  const base=_accountBalance||1;
  title.innerHTML=MONTHS[cm]+" <span>"+cy+"</span>";grid.innerHTML="";
  DOW.forEach(d=>{const h=document.createElement('div');h.className="dow";h.textContent=d;grid.appendChild(h);});
  const totH=document.createElement('div');totH.className="dow tot";totH.textContent="Total";grid.appendChild(totH);
  const offset=(new Date(cy,cm,1).getDay()+6)%7,daysIn=new Date(cy,cm+1,0).getDate();
  const cells=[];for(let i=0;i<offset;i++)cells.push({out:true,n:new Date(cy,cm,1-offset+i).getDate()});
  for(let d=1;d<=daysIn;d++)cells.push({d});let nx=1;while(cells.length%7!==0)cells.push({out:true,n:nx++});
  const now=new Date();
  for(let w=0;w<cells.length/7;w++){
    let wsum=0,whas=false;
    for(let i=0;i<7;i++){
      const c=cells[w*7+i],cell=document.createElement('div');
      if(c.out){cell.className="day out";cell.innerHTML='<div class="big">'+c.n+'</div>';grid.appendChild(cell);continue;}
      const isToday=(cy===now.getFullYear()&&cm===now.getMonth()&&c.d===now.getDate());
      const v=data[c.d];
      if(v!==undefined){
        const win=v>=0;
        cell.className="day click "+(win?"win":"loss");
        const pct=(v/base*100).toFixed(2)+'%';
        cell.innerHTML='<div class="n">'+c.d+'</div><div class="mid"><div class="v"></div><div class="p">'+pct+'</div></div>';
        cell.querySelector('.v').textContent=(v<0?"-$":"$")+Math.abs(v).toFixed(2);
        wsum+=v;whas=true;
      }else{cell.className="day flat click"+(isToday?" today":"");cell.innerHTML='<div class="big">'+c.d+'</div>';}
      const dd=c.d;cell.addEventListener('click',()=>openModal(cy,cm,dd));
      grid.appendChild(cell);
    }
    const t=document.createElement('div');
    if(whas){t.className="tot-cell "+(wsum>=0?"pos":"neg");
      t.innerHTML='<div class="tv">'+fmt$(wsum)+'</div><div class="tp">'+(wsum>=0?"+":"")+(wsum/base*100).toFixed(2)+'%</div>';
    }else{t.className="tot-cell empty";t.textContent="-";}
    grid.appendChild(t);
  }
  const s=getMonthSummary(cy,cm);
  if(s.trades>0){
    summaryEl.style.display="";
    summaryEl.innerHTML=
      '<div class="it"><span class="k">Trades</span><span class="v">'+s.trades+'</span></div>'+
      '<div class="it"><span class="k">Wins</span><span class="v">'+s.wins+'</span></div>'+
      '<div class="it"><span class="k">Profits</span><span class="v">'+s.profits+'</span></div>'+
      '<div class="it"><span class="k">Percent</span><span class="v">'+s.percent+'</span></div>';
  }else{summaryEl.style.display="none";}
}

document.getElementById('prevM').onclick=()=>{cm--;if(cm<0){cm=11;cy--;}renderCal();renderTH();};
document.getElementById('nextM').onclick=()=>{cm++;if(cm>11){cm=0;cy++;}renderCal();renderTH();};

/* --- Modal day stats (real data) --- */
function dayStats(y,m,d){
  const dayTrades=_allTransactions.filter(t=>{
    const dt=parseUTC(t.close_time);
    return dt&&dt.getFullYear()===y&&dt.getMonth()===m&&dt.getDate()===d;
  });
  const pnlList=dayTrades.map(t=>netPnl(t));
  const pnl=+pnlList.reduce((a,b)=>a+b,0).toFixed(2);
  const pct=_accountBalance>0?(pnl/_accountBalance*100).toFixed(2)+'%':'0.00%';
  const buys=dayTrades.filter(t=>/buy/i.test(t.type||'')).length;
  const sells=dayTrades.filter(t=>/sell/i.test(t.type||'')).length;
  const trades=dayTrades.length;
  const wins=pnlList.filter(v=>v>0).length;
  const best=pnlList.length?Math.max(...pnlList):0;
  const worst=pnlList.length?Math.min(...pnlList):0;
  const fees=+dayTrades.reduce((a,t)=>a+(parseFloat(t.commission)||0),0).toFixed(2);
  const winrate=trades>0?Math.round(wins/trades*100):0;
  const grossW=pnlList.filter(v=>v>0).reduce((a,b)=>a+b,0);
  const grossL=Math.abs(pnlList.filter(v=>v<0).reduce((a,b)=>a+b,0));
  const pf=grossL>0?+(grossW/grossL).toFixed(2):(grossW>0?'∞':0);
  const exp=trades>0?+(pnl/trades).toFixed(2):0;
  let totalMs=0;
  dayTrades.forEach(t=>{const o=parseUTC(t.open_time),c=parseUTC(t.close_time);if(o&&c)totalMs+=c-o;});
  const hold=trades>0?Math.round(totalMs/trades/60000):0;
  return{pnl,pct,buys,sells,trades,best,worst,hold,fees,winrate,pf,exp};
}

const fmtHold=m=>m<=0?"—":(m<60?m+" min":Math.floor(m/60)+"h "+(m%60)+"m");
const sign=(elm,v)=>{elm.classList.remove('pos','neg','neu','accent');elm.classList.add(v>0?'pos':v<0?'neg':'neu');};
const modal=document.getElementById('modal');
const mCard=modal.querySelector('.m-card');
const ANIM_SELECTORS=['.m-date','.m-pnl','.m-sect','.m-overview','.m-boxes','.m-rows','.m-journal'];
function replayEntrance(){
  ANIM_SELECTORS.forEach(sel=>{
    const node=mCard.querySelectorAll(sel);
    node.forEach(n=>{n.style.animation='none';void n.offsetWidth;n.style.animation='';});
  });
}
function countUp(el,target,prefix,duration){
  const start=performance.now(),from=0;
  function tick(now){
    const t=Math.min(1,(now-start)/duration);
    const eased=1-Math.pow(1-t,3);
    const val=from+(target-from)*eased;
    el.textContent=prefix+Math.abs(val).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(t<1)requestAnimationFrame(tick);else el.textContent=prefix+Math.abs(target).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  requestAnimationFrame(tick);
}
function openModal(y,m,d){
  const s=dayStats(y,m,d),dt=new Date(y,m,d),pos=s.pnl>=0;
  document.getElementById('mDate').textContent=`${WD[dt.getDay()]}, ${MONTHS[m].slice(0,3)} ${d}, ${y}`;
  const wrap=document.getElementById('mPnlWrap');wrap.classList.toggle('pos',pos);
  const pnlEl=document.getElementById('mPnl');
  pnlEl.classList.remove('pos','neg');pnlEl.classList.add(s.pnl>0?'pos':s.pnl<0?'neg':'');
  countUp(pnlEl,s.pnl,s.pnl<0?'-':'',520);
  const up='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 7 13.5 15.5l-5-5L2 17"/><path d="M16 7h6v6"/></svg>';
  const down='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 17 13.5 8.5l-5 5L2 7"/><path d="M16 17h6v-6"/></svg>';
  const pctEl=document.getElementById('mPct');pctEl.innerHTML=(pos?up:down)+'<span>'+s.pct+'</span>';
  pctEl.style.color=s.pnl>0?'var(--green-val)':s.pnl<0?'var(--red-val)':'var(--muted)';
  document.getElementById('mStart').textContent='—';
  document.getElementById('mEnd').textContent='—';
  document.getElementById('mDep').textContent=fmt$(0);
  document.getElementById('mBuys').textContent=s.buys;
  document.getElementById('mSells').textContent=s.sells;
  document.getElementById('mTrades').textContent=s.trades;
  document.getElementById('mBest').textContent=fmt$(s.best);
  const worst=document.getElementById('mWorst');worst.textContent=fmt$(s.worst);sign(worst,s.worst||-0);worst.classList.toggle('neg',s.worst<0);worst.classList.toggle('neu',s.worst>=0);
  document.getElementById('mHold').textContent=fmtHold(s.hold);
  document.getElementById('mDD').textContent='—';
  document.getElementById('mFees').textContent=fmt$(s.fees);
  const wr=document.getElementById('mWR');wr.textContent=s.winrate+'%';wr.className='mv '+(s.winrate>=50?'pos':'neg');
  const pf=document.getElementById('mPF');pf.textContent=s.pf;pf.className='mv '+(typeof s.pf==='number'&&s.pf>1?'pos':'neu');
  const ex=document.getElementById('mExp');ex.textContent=fmtN(s.exp);ex.className='mv '+(s.exp>0?'pos':s.exp<0?'neg':'neu');
  modal.classList.add('show');
  document.body.style.overflow='hidden';
  replayEntrance();
}
function closeModal(){modal.classList.remove('show');document.body.style.overflow='';}
document.getElementById('mClose').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))closeModal();});

/* --- Init --- */
async function init(){
  showTHSkeleton();
  renderCal();
  try{
    const raw=localStorage.getItem('win_user');
    if(!raw){renderTH();return;}
    const user=JSON.parse(raw);
    const res=await fetch(`/api/linked-accounts?user_id=${encodeURIComponent(user.id)}`);
    const json=await res.json();
    const rows=json.accounts||[];
    _resolvedAccounts=rows.map(r=>r.broker_clients?.id??r.id);
    const idx=+(localStorage.getItem('win_selected_account')||0);
    const acctRow=rows[idx]||rows[0];
    if(acctRow?.broker_clients)_accountBalance=parseFloat(acctRow.broker_clients.balance||0);
    _accountId=_resolvedAccounts[idx]??_resolvedAccounts[0]??null;
    if(_accountId){
      const txRes=await fetch(`/api/transactions?account_id=${_accountId}&page=0&per_page=1000`);
      const txJson=await txRes.json();
      _allTransactions=txJson.transactions||[];
    }
  }catch(e){console.error(e);}
  renderCal();renderTH();
}

let _lastIdx=+(localStorage.getItem('win_selected_account')||0);
setInterval(async()=>{
  const idx=+(localStorage.getItem('win_selected_account')||0);
  if(idx===_lastIdx)return;
  _lastIdx=idx;
  _accountId=_resolvedAccounts[idx]??null;
  if(!_accountId)return;
  showTHSkeleton();
  try{
    const txRes=await fetch(`/api/transactions?account_id=${_accountId}&page=0&per_page=1000`);
    const txJson=await txRes.json();
    _allTransactions=txJson.transactions||[];
  }catch(e){console.error(e);}
  renderCal();renderTH();
},500);

init();
</script>
</body>
